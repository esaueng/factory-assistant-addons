name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate catalog contract
        run: |
          bash tests/test_catalog_alignment.sh
          bash tests/test_image_publish_workflow.sh

      - name: Check shell syntax
        run: |
          bash -n \
            tests/test_catalog_alignment.sh \
            tests/test_image_publish_workflow.sh \
            opcua-mqtt-bridge/run.sh \
            plc-gateway-helper/run.sh \
            historian-storage/run.sh \
            node-red/posture-banner.sh

      - name: Check Python syntax
        run: |
          python3 -m py_compile \
            opcua-mqtt-bridge/bridge.py \
            plc-gateway-helper/gateway_helper.py \
            historian-storage/exporter.py

      - name: Set up Python for availability tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install availability test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto
          python -m pip install -r opcua-mqtt-bridge/requirements.txt -r plc-gateway-helper/requirements.txt

      - name: Test telemetry availability
        run: python -m unittest discover -s tests -p 'test_*.py' -v
